name: Build DeepRake V1 Windows Installer

on:
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check out the packaging project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller==6.22.3"

      - name: Verify V1 behavior
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build bundled DeepRake executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name DeepRake --add-data "templates;templates" --add-data "data/dorks;data/dorks" deeprake_desktop.py

      - name: Install Windows installer builder
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build one-click installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw "Inno Setup compiler ISCC.exe was not found." }
          & $compiler "installer\DeepRake.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DeepRake-Windows-Installer
          path: release/DeepRake_Setup.exe
          if-no-files-found: error
